<svg xmlns="http://www.w3.org/2000/svg" width="860" height="58" viewBox="0 0 860 58">
  <style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>
  <rect x=".5" y=".5" width="859" height="57" rx="12" fill="#0d1117" stroke="#30363d"/>
  <circle cx="20" cy="18" r="4" fill="#ff5f56"/>
  <circle cx="34" cy="18" r="4" fill="#ffbd2e"/>
  <circle cx="48" cy="18" r="4" fill="#27c93f"/>
  <text x="70" y="22" fill="#8b949e" font-size="11">pedrssa@github:~</text>
  <text x="22" y="44" fill="#39d353" font-size="14">$</text>

  <g opacity="1">
    <text x="43" y="44" fill="#c9d1d9" font-size="14">building software</text>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.28;0.33;1" dur="9s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <text x="43" y="44" fill="#c9d1d9" font-size="14">automating workflows</text>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.28;0.33;1" dur="9s" begin="3s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <text x="43" y="44" fill="#c9d1d9" font-size="14">shipping products</text>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.28;0.33;1" dur="9s" begin="6s" repeatCount="indefinite"/>
  </g>

  <rect x="225" y="32" width="8" height="14" rx="1" fill="#39d353">
    <animate attributeName="opacity" values="1;1;0;0;1" dur="1.05s" repeatCount="indefinite"/>
  </rect>
</svg>
